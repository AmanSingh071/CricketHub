<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CricketHub TV</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #player{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
    #idle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#123322 0,#07110d 42%,#000 100%);text-align:center;padding:40px}
    #idle .box{max-width:720px}.logo{font-size:46px;font-weight:900;letter-spacing:-2px}.green{color:#4ade80}.title{font-size:30px;font-weight:800;margin-top:12px}.hint{margin-top:12px;color:#9ca3af;font-size:18px}
    #status{position:fixed;left:24px;bottom:24px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.7);font-size:14px;color:#cbd5e1;display:none}
  </style>
</head>
<body>
  <div id="idle"><div class="box"><div class="logo">🏏 <span class="green">CricketHub</span></div><div class="title">Ready to watch</div><div class="hint">Choose CricketHub from your phone or computer and tap the TV icon.</div></div></div>
  <iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <div id="status"></div>
  <script>
    (function(){
      const NAMESPACE='urn:x-cast:com.crickethub.player';
      const ALLOWED_HOSTS=['daddylive.app'];
      const iframe=document.getElementById('player');
      const idle=document.getElementById('idle');
      const status=document.getElementById('status');
      function showStatus(text){status.textContent=text;status.style.display=text?'block':'none'}
      function allowed(url){try{const u=new URL(url);return u.protocol==='https:'&&ALLOWED_HOSTS.includes(u.hostname)}catch{return false}}
      const context=cast.framework.CastReceiverContext.getInstance();
      context.addCustomMessageListener(NAMESPACE,function(event){
        const data=event.data||{};
        if(data.type!=='LOAD_CHANNEL'||!allowed(data.channelUrl)){
          showStatus('This channel cannot be cast from its current source.');
          return;
        }
        idle.style.display='none';
        iframe.style.display='block';
        showStatus('Playing '+(data.channelName||'CricketHub'));
        iframe.src=data.channelUrl;
      });
      context.start();
    })();
  </script>
</body>
</html>
